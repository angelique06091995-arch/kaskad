<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cascade Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Более яркая, сочная палитра */
            --main-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-bright: #00f2fe;
            --btn-grad: linear-gradient(to right, #00dbde 0%, #fc00ff 100%);
            --text-main: #2d3436;
            --bg-soft: #f0f2f5;
        }

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: var(--main-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            margin: 0;
            color: var(--text-main);
        }

        .app-card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
            background: var(--btn-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            padding: 18px;
            border: 2px solid #eee;
            border-radius: 15px;
            font-size: 1rem;
            resize: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        textarea:focus {
            border-color: #764ba2;
            outline: none;
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.2);
        }

        .btn-generate {
            background: var(--btn-grad);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 0, 255, 0.3);
        }

        /* Прогресс-бар */
        .progress-container {
            height: 8px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 25px;
            display: none; /* Появится при наличии задач */
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: var(--btn-grad);
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Список задач */
        #taskList {
            list-style: none;
            padding: 0;
        }

        .task-item {
            background: #fff;
            border-left: 5px solid #667eea;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .task-item.completed {
            opacity: 0.6;
            background: #f8f9fa;
            border-left-color: #2ecc71;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
        }

        .check-btn {
            min-width: 24px;
            height: 24px;
            border: 2px solid #667eea;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .completed .check-btn {
            background: #2ecc71;
            border-color: #2ecc71;
        }

        .task-text {
            flex-grow: 1;
            font-weight: 400;
            outline: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .btn-reset {
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .btn-reset:hover { opacity: 1; }

        /* Лоадер */
        #loader {
            display: none;
            text-align: center;
            margin-bottom: 20px;
            font-style: italic;
            color: #764ba2;
        }
    </style>
</head>
<body>

<div class="app-card">
    <h1>CASCADE AI</h1>
    
    <div class="input-section">
        <textarea id="goalInput" rows="3" placeholder="Опиши свою большую цель..."></textarea>
        <button class="btn-generate" onclick="handleStart()">Декомпозировать</button>
    </div>

    <div id="loader">Нейросеть дробит задачу...</div>

    <div class="progress-container" id="progressContainer">
        <div id="progress-fill"></div>
    </div>

    <ul id="taskList"></ul>

    <div class="controls">
        <button class="btn-reset" onclick="resetAll()">Сбросить всё</button>
    </div>
</div>

<script>
    const goalInput = document.getElementById('goalInput');
    const taskList = document.getElementById('taskList');
    const progressFill = document.getElementById('progress-fill');
    const progressContainer = document.getElementById('progressContainer');
    const loader = document.getElementById('loader');

    // --- СВЯЗКА С ИИ ---
    async function getAIResponse(userGoal) {
        /** * МЕСТО ДЛЯ ТВОЕГО КОДА:
         * Сюда ты вставишь fetch-запрос к своему бэкенду или API.
         * Ожидается массив строк.
         */
        
        // Имитация задержки ИИ
        await new Promise(resolve => setTimeout(resolve, 1500));

        // Временная заглушка (замени это логикой из нейронки)
        return [
            "Разбить " + userGoal + " на этапы",
            "Определить необходимые ресурсы",
            "Выполнить первый шаг",
            "Провести промежуточный анализ",
            "Завершить проект"
        ];
    }

    async function handleStart() {
        const goal = goalInput.value.trim();
        if (!goal) return;

        loader.style.display = 'block';
        taskList.innerHTML = '';
        progressContainer.style.display = 'none';

        try {
            const subtasks = await getAIResponse(goal);
            
            loader.style.display = 'none';
            progressContainer.style.display = 'block';
            
            subtasks.forEach(text => addTask(text));
            updateProgress();
        } catch (error) {
            console.error("Ошибка ИИ:", error);
            loader.innerText = "Ошибка при загрузке данных.";
        }
    }

    function addTask(text) {
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
            <div class="check-btn" onclick="toggleTask(this)"></div>
            <span class="task-text" contenteditable="true" onblur="updateProgress()">${text}</span>
        `;
        taskList.appendChild(li);
    }

    function toggleTask(el) {
        el.parentElement.classList.toggle('completed');
        updateProgress();
    }

    function updateProgress() {
        const tasks = document.querySelectorAll('.task-item');
        const completed = document.querySelectorAll('.task-item.completed').length;
        
        if (tasks.length > 0) {
            progressContainer.style.display = 'block';
            const percent = (completed / tasks.length) * 100;
            progressFill.style.width = percent + '%';
        } else {
            progressContainer.style.display = 'none';
        }
    }

    function resetAll() {
        if (confirm("Начать заново?")) {
            goalInput.value = '';
            taskList.innerHTML = '';
            updateProgress();
        }
    }
</script>

</body>
</html>
