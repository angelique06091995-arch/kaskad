<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cascade Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --btn-grad: linear-gradient(to right, #00dbde 0%, #fc00ff 100%);
            --text-main: #2d3436;
        }
        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body {
            background: var(--main-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 40px 20px; margin: 0; color: var(--text-main);
        }
        .app-card {
            background: rgba(255, 255, 255, 0.95); width: 100%; max-width: 600px;
            padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        h1 {
            font-weight: 700; text-align: center;
            background: var(--btn-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 30px; letter-spacing: -1px;
        }
        .input-section { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        textarea {
            width: 100%; padding: 18px; border: 2px solid #eee; border-radius: 15px;
            font-size: 1rem; resize: none; outline: none; transition: 0.3s;
        }
        textarea:focus { border-color: #764ba2; }
        .btn-generate {
            background: var(--btn-grad); color: white; border: none; padding: 15px;
            border-radius: 15px; font-weight: 600; cursor: pointer; text-transform: uppercase;
            transition: transform 0.2s;
        }
        .btn-generate:active { transform: scale(0.98); }
        #loader { display: none; text-align: center; margin-bottom: 20px; color: #764ba2; font-weight: 600; }
        .progress-container { height: 8px; background: #eee; border-radius: 10px; margin-bottom: 25px; display: none; }
        #progress-fill { height: 100%; width: 0%; background: var(--btn-grad); border-radius: 10px; transition: 0.5s; }
        #taskList { list-style: none; padding: 0; }
        .task-item {
            background: #fff; border-left: 5px solid #667eea; margin-bottom: 12px;
            padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .task-item.completed { opacity: 0.6; border-left-color: #2ecc71; }
        .task-item.completed .task-text { text-decoration: line-through; }
        .check-btn { width: 24px; height: 24px; border: 2px solid #667eea; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
        .completed .check-btn { background: #2ecc71; border-color: #2ecc71; position: relative; }
        .completed .check-btn::after {
            content: '✔'; color: white; font-size: 14px; position: absolute; left: 4px; top: 0px;
        }
        .task-text { flex-grow: 1; outline: none; line-height: 1.4; font-weight: 500; font-size: 0.95rem; }
        .btn-reset { display: block; margin: 30px auto 0; background: none; border: none; color: #ff4757; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="app-card">
    <h1>CASCADE AI</h1>
    <div class="input-section">
        <textarea id="goalInput" rows="3" placeholder="Введите сложную цель для экспертной декомпозиции..."></textarea>
        <button id="mainBtn" class="btn-generate" onclick="handleStart()">Декомпозировать</button>
    </div>
    <div id="loader">Думаю...</div>
    <div class="progress-container" id="progressContainer">
        <div id="progress-fill"></div>
    </div>
    <ul id="taskList"></ul>
    <button class="btn-reset" onclick="resetAll()">Сбросить всё</button>
</div>

<script>
    const WEBHOOK_URL = 'https://n8n.2gis.io/webhook/28414bc9-9b12-4c01-b698-fbf5aaf47485';

    async function handleStart() {
        const input = document.getElementById('goalInput');
        const goal = input.value.trim();
        if (!goal) return alert("Введите цель");

        const loader = document.getElementById('loader');
        const taskList = document.getElementById('taskList');
        const btn = document.getElementById('mainBtn');
        
        loader.style.display = 'block';
        btn.disabled = true; btn.style.opacity = '0.5';
        taskList.innerHTML = '';

        // ЗАДАЕМ РОЛЬ ЭКСПЕРТА ПРЯМО В ЗАПРОСЕ
        const expertPrompt = `Действуй как эксперт по стратегическому планированию. Разбей цель "${goal}" на конкретные, измеримые шаги. Выдай ТОЛЬКО список задач без вступлений, пояснений и вежливости.`;

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    goal: expertPrompt, // Отправляем промпт с ролью
                    original_goal: goal 
                })
            });

            const data = await response.json();
            loader.style.display = 'none';
            btn.disabled = false; btn.style.opacity = '1';

            let rawText = (typeof data === 'string') ? data : (data.output || data.text || JSON.stringify(data));

            // --- ФИЛЬТР "ПРОФЕССИОНАЛ" (удаляет мусор) ---
            const tasks = rawText
                .split('\n')
                .map(line => line.replace(/[#*—]/g, '').replace(/\[[\sxX]?\]/g, '').replace(/^[-•\d.]+\s?/, '').trim())
                .filter(line => {
                    const low = line.toLowerCase();
                    const isJunk = line.length < 5 || line.endsWith('?') || line.endsWith(':') || line.includes('---');
                    const isIntro = /^(вот|вижу|отличная|зачем|какой|о чем|инструкц|план|шаг|ниже|это|подготов|разработ|актуаль|поэтап)/.test(low);
                    const isFiller = /(надеюсь|поможет|удач|системно|эффективно|забыть|согласно|простой|понятный|несложная)/.test(low);
                    return !isJunk && !isIntro && !isFiller;
                });

            if (tasks.length === 0) {
                addTask("ИИ не выдал четких задач. Попробуйте уточнить запрос.");
            } else {
                tasks.forEach(t => addTask(t));
            }
            updateProgress();
        } catch (e) {
            loader.innerText = "Ошибка соединения.";
            btn.disabled = false; btn.style.opacity = '1';
        }
    }

    function addTask(text) {
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `<div class="check-btn" onclick="toggleTask(this)"></div><span class="task-text" contenteditable="true">${text}</span>`;
        document.getElementById('taskList').appendChild(li);
    }

    function toggleTask(el) {
        el.parentElement.classList.toggle('completed');
        updateProgress();
    }

    function updateProgress() {
        const tasks = document.querySelectorAll('.task-item').length;
        const completed = document.querySelectorAll('.task-item.completed').length;
        const container = document.getElementById('progressContainer');
        if (tasks > 0) {
            container.style.display = 'block';
            document.getElementById('progress-fill').style.width = (completed / tasks * 100) + '%';
        }
    }

    function resetAll() {
        if (confirm("Очистить текущий план?")) {
            document.getElementById('goalInput').value = '';
            document.getElementById('taskList').innerHTML = '';
            document.getElementById('progressContainer').style.display = 'none';
        }
    }
</script>
</body>
</html>
